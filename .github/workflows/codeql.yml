# CodeQL: GitHub's static analysis for security vulnerabilities.
#
# This is not redundant with SpotBugs, which already runs in `mvn verify`.
# The two answer different questions:
#
#   SpotBugs finds bug *patterns* in bytecode -- a null dereference, a
#   comparison that is always false, an unclosed stream.
#
#   CodeQL does *dataflow* analysis: it traces whether attacker-controlled
#   input can reach a dangerous operation. That is how SQL injection, path
#   traversal, and SSRF are found, and pattern matching cannot find them
#   because the bug is the *path* between two places, not either place.
#
# Findings appear in the repository's Security tab, not just the job log.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Wednesdays, offset from the Security workflow's Monday run so a bad
    # week does not fire every scheduled scan at once.
    - cron: '0 6 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required for CodeQL to upload its findings to the Security tab.
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Manual build: CodeQL's autobuild would run the default lifecycle,
          # which here means the full test suite including Testcontainers.
          # Analysis only needs compiled classes, so building without tests
          # takes minutes off every run for no loss in coverage.
          build-mode: manual
          queries: security-extended

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
