# On-demand AI code review, triggered by mentioning @claude in a comment.
#
# SECURITY: the triggers here are deliberate and must not be "simplified".
#
# The obvious-looking alternative is `pull_request_target`, which would let
# this run automatically on every PR. It is deliberately NOT used. Unlike
# `pull_request`, that trigger runs with full access to repository secrets
# while checking out the pull request's code -- so on a public repository,
# anyone could open a PR whose code prints ANTHROPIC_API_KEY somewhere they
# can read it. It is a well-documented exfiltration path.
#
# Comment triggers avoid it entirely: the workflow only runs when a human
# with write access types @claude, so untrusted code never runs with the
# secret present. See docs/cicd.md.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    name: Respond to @claude
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Two conditions, both required. The mention check avoids running on every
    # comment; the association check means only repository collaborators can
    # trigger it, so a stranger commenting "@claude" on an issue cannot spend
    # the API budget.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER'
      )

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
