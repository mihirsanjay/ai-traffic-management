spring:
  application:
    name: rule-service

  datasource:
    # Matches infra/docker-compose.yml. Throwaway loopback credentials, and
    # deliberately committed - real secrets never live in this repository.
    url: jdbc:postgresql://localhost:5432/rule_service
    username: traffic
    password: traffic
    hikari:
      # Every remote call needs an explicit timeout; a pool that waits forever
      # turns a slow database into a total outage.
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. `validate` turns a drift between entity and
    # migration into a startup failure rather than letting Hibernate silently
    # reshape the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Matches infra/docker-compose.yml. Holds rate-limit counters only -
      # reconstructible state, never a source of truth, so losing it costs one
      # window of limits rather than data.
      host: localhost
      port: 6379

rule-service:
  # Bounds on the optimistic-locking retry for rule version increment (ADR
  # 0008). Contention on one rule is rare - a human edits a throttling rule
  # occasionally - so this budget is sized to absorb an unlucky collision, not
  # a sustained write storm. Both caps matter: whichever is hit first ends the
  # retry and the caller gets a 409 rather than a masked success.
  version-retry:
    max-attempts: 5
    initial-backoff: 20ms
    max-backoff: 200ms
    max-elapsed: 2s
    # Randomises each backoff downward by up to this fraction, so two writers
    # that collided do not wake together and collide again.
    jitter-factor: 0.5

  rate-limit:
    enabled: true
    # Generous on purpose: this guards the control plane against a runaway
    # client, it does not ration normal use. Counters live in Redis so the
    # budget is shared across instances - a per-instance bucket would let N
    # instances serve N times this number.
    capacity: 100
    refill-period: 1m
    # Every remote call needs an explicit timeout. Without one a stalled Redis
    # would hang the very API this limiter protects; when it does fire, the
    # filter fails open and the request proceeds unthrottled.
    redis-timeout: 1s

server:
  port: 8080
  error:
    # Error bodies come from GlobalExceptionHandler as RFC 7807 ProblemDetail;
    # the container's default error page must never leak a stack trace.
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    com.mihir.traffic: INFO
