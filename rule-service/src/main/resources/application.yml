spring:
  application:
    name: rule-service

  datasource:
    # Matches infra/docker-compose.yml. Throwaway loopback credentials, and
    # deliberately committed - real secrets never live in this repository.
    url: jdbc:postgresql://localhost:5432/rule_service
    username: traffic
    password: traffic
    hikari:
      # Every remote call needs an explicit timeout; a pool that waits forever
      # turns a slow database into a total outage.
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. `validate` turns a drift between entity and
    # migration into a startup failure rather than letting Hibernate silently
    # reshape the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Matches infra/docker-compose.yml's host listener. Containers on the compose
    # network use kafka:29092 instead; a broker advertises the address clients
    # should use after the initial metadata exchange, so the two cannot be the
    # same value.
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The outbox already holds a serialized envelope. Sending that string
      # verbatim means the bytes reviewed in the outbox row are exactly the bytes
      # on the topic, and keeps this service's package names out of a public
      # contract - which a JsonSerializer's type headers would leak.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: not acknowledged until every in-sync replica has it. Anything
      # weaker means a broker failure can lose an event the outbox has already
      # marked published, discarding the durability the outbox exists to provide
      # at the very last step.
      acks: all
      properties:
        # Without this, an internal producer retry can write the same record
        # twice with the same event id - a duplicate no consumer dedup key would
        # catch, because it is genuinely the same event twice on the wire.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

  data:
    redis:
      # Matches infra/docker-compose.yml. Holds rate-limit counters only -
      # reconstructible state, never a source of truth, so losing it costs one
      # window of limits rather than data.
      host: localhost
      port: 6379

rule-service:
  # Bounds on the optimistic-locking retry for rule version increment (ADR
  # 0008). Contention on one rule is rare - a human edits a throttling rule
  # occasionally - so this budget is sized to absorb an unlucky collision, not
  # a sustained write storm. Both caps matter: whichever is hit first ends the
  # retry and the caller gets a 409 rather than a masked success.
  version-retry:
    max-attempts: 5
    initial-backoff: 20ms
    max-backoff: 200ms
    max-elapsed: 2s
    # Randomises each backoff downward by up to this fraction, so two writers
    # that collided do not wake together and collide again.
    jitter-factor: 0.5

  outbox:
    # The scheduled poll. Disabled in integration tests, which call
    # publishPending() directly so assertions cannot race a background poll.
    enabled: true
    poll-interval: 1s
    initial-delay: 5s
    batch-size: 100
    # Every remote call needs an explicit timeout. A send future without one
    # waits as long as the producer's delivery settings allow, and one
    # unreachable broker would stall the whole backlog behind it.
    send-timeout: 5s

  rate-limit:
    enabled: true
    # Generous on purpose: this guards the control plane against a runaway
    # client, it does not ration normal use. Counters live in Redis so the
    # budget is shared across instances - a per-instance bucket would let N
    # instances serve N times this number.
    capacity: 100
    refill-period: 1m
    # Every remote call needs an explicit timeout. Without one a stalled Redis
    # would hang the very API this limiter protects; when it does fire, the
    # filter fails open and the request proceeds unthrottled.
    redis-timeout: 1s

server:
  port: 8080
  error:
    # Error bodies come from GlobalExceptionHandler as RFC 7807 ProblemDetail;
    # the container's default error page must never leak a stack trace.
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    com.mihir.traffic: INFO
